<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4536AA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A468D5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AEE691;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#faviconGradient)" opacity="0.15"/>
  
  <!-- "C" letter -->
  <text x="16" y="22" font-family="Sora, sans-serif" font-size="20" font-weight="700" fill="url(#faviconGradient)" text-anchor="middle">
    C
  </text>
</svg>