<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4536AA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A468D5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AEE691;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo text "clout" -->
  <text x="10" y="50" font-family="Sora, sans-serif" font-size="36" font-weight="700" fill="url(#logoGradient)" letter-spacing="-1">
    clout
  </text>
  
  <!-- Logo text "culturr" -->
  <text x="10" y="90" font-family="Sora, sans-serif" font-size="36" font-weight="700" fill="url(#logoGradient)" letter-spacing="-1">
    culturr.
  </text>
</svg>